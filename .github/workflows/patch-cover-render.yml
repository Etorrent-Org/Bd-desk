name: Apply cover render pipeline patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-cover-render.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate patcher
        run: node --check scripts/apply-cover-render-patch.cjs
      - name: Apply patch
        run: node scripts/apply-cover-render-patch.cjs
      - name: Validate application
        run: |
          node --check src/app.js
          node --check public/cover-sources.js
          node --test tests/cover-render-pipeline.test.js
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/live-cover-recovery.yml
          git add src/app.js public/cover-sources.js tests/cover-render-pipeline.test.js
          git commit -m "fix: guarantee renderable real covers"
          git push origin HEAD:main
