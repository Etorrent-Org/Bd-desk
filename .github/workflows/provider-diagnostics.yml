name: Provider diagnostics
on:
  push:
    branches: [ops/provider-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BDbase exact ISBN search
        run: |
          curl -fsSL -A 'BD-Desk/1.0 (+https://github.com/Etorrent-Org/Bd-desk)' 'https://www.bdbase.fr/recherche?sch=9782919069910' -o /tmp/result.html
          echo "BYTES=$(wc -c < /tmp/result.html)"
          grep -n -E -A4 -B4 '9782919069910|Trafika' /tmp/result.html | head -100 || true
          grep -Eio 'href="/bd/[^"]+"' /tmp/result.html | head -30 || true
          grep -Eio '(src|data-src)="https://static\.bdbase\.fr/[^"]+"' /tmp/result.html | head -30 || true

      - name: Inspect BDbase bibliographic search
        run: |
          curl -fsSL -A 'BD-Desk/1.0 (+https://github.com/Etorrent-Org/Bd-desk)' 'https://www.bdbase.fr/recherche?sch=Blueberry%20Chihuahua%20Pearl' -o /tmp/meta.html
          echo "META_BYTES=$(wc -c < /tmp/meta.html)"
          grep -n -E -A4 -B4 'Chihuahua|Blueberry' /tmp/meta.html | head -120 || true
          grep -Eio 'href="/bd/[^"]+"' /tmp/meta.html | head -30 || true
