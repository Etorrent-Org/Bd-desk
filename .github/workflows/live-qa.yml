name: Live QA

on:
  push:
    paths:
      - '.github/workflows/live-qa.yml'
  workflow_dispatch:

jobs:
  validate-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: External metadata APIs
        run: npm run test:external -- 9782203237766
      - name: Docker build
        run: docker build -t bd-desk:qa .
