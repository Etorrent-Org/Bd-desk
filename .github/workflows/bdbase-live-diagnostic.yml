name: BDbase live diagnostic
on:
  push:
    branches: [feat/bdbase-cover-fallback]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve live residual catalog against BDbase
        run: |
          node --input-type=module <<'NODE'
          import { fetchBdbaseCoverCandidates } from './src/bdbase-covers.js';
          const albums=[
            {id:463,isbn:'9782369815921',series:'Venin (La)',number:'5',title:'Soleil de plomb',publisher:'Rue de Sèvres'},
            {id:347,isbn:'9791093603407',series:'Smart Girl',number:'2',title:'Tome 2',publisher:'Réflexions'},
            {id:423,isbn:'9782919069910',series:'Trafika',title:'Trafika',publisher:"Des Bulles dans l'Océan"},
            {id:263,isbn:'9791095720294',series:'Mister No Revolution',number:'3',title:'Amazonie',publisher:'Fordis'},
            {id:289,isbn:'9782302093027',series:'No Zombies',number:'2',title:'Le livre de Cassandre',publisher:'Soleil Productions'},
            {id:324,isbn:'3770013604577',series:'Rags',number:'2',title:'Rags 2',publisher:'Alayone Comics'},
            {id:323,isbn:'3770013604065',series:'Rags',number:'1',title:'Rags 1',publisher:'Alayone Comics'},
            {id:346,isbn:'9791093603377',series:'Smart Girl',number:'1',title:'Smart Girl 1',publisher:'Réflexions'},
            {id:42,series:'Blake et Mortimer (Les Aventures de)',number:'18',title:'Le Sanctuaire du Gondwana',publisher:'Gombert Editions'},
            {id:50,isbn:'9782205000412',series:'Blake et Mortimer historique',number:'1',title:"Le Secret de l'Espadon Tome I",publisher:'Dargaud'},
            {id:51,series:'Blake et Mortimer historique',number:'2',title:"Le Secret de l'Espadon 2",publisher:'Lombard'},
            {id:52,series:'Blake et Mortimer historique',number:'3',title:'Le Mystère de la Grande Pyramide 1re partie',publisher:'Dargaud'},
            {id:53,series:'Blake et Mortimer historique',number:'4',title:'Le Mystère de la Grande Pyramide 2e partie',publisher:'Lombard'},
            {id:54,series:'Blake et Mortimer historique',number:'5',title:'La Marque Jaune',publisher:'Lombard'},
            {id:56,series:'Blake et Mortimer historique',number:'9',title:"L'Affaire du collier",publisher:'Lombard'},
            {id:57,series:'Blake et Mortimer historique',number:'10',title:'Les 3 Formules du Prof. Sato 1ère partie',publisher:'Lombard'},
            {id:59,series:'Blueberry',number:'2',title:"Tonnerre à l'ouest",publisher:'Dargaud'},
            {id:60,series:'Blueberry',number:'10',title:"Général 'Tête Jaune'",publisher:'Dargaud'},
            {id:63,series:'Blueberry',number:'13',title:'Chihuahua Pearl',publisher:'Dargaud'},
            {id:64,series:'Blueberry',number:'14',title:"L'homme qui valait 500 000 $",publisher:'Dargaud'},
            {id:65,series:'Blueberry',number:'16',title:'Le hors la loi',publisher:'Dargaud'},
            {id:362,isbn:'9782800146218',series:'Spirou et Fantasio',number:'11',title:'Le gorille a bonne mine',publisher:'Dupuis'},
            {id:33,isbn:'9782724252675',series:'Bidochon France Loisirs double',title:'Ragots intimes / En voyage organisé',publisher:'France Loisirs'},
            {id:419,series:'Tintin historique',number:'14',title:'Le temple du soleil',publisher:'Casterman'},
            {id:184,isbn:'9782298013726',series:"L'Incal",title:'Intégrale',publisher:'France Loisirs'},
            {id:147,isbn:'9782203020085',series:'Bilal coffret Intégrale',number:'1',title:'La Trilogie Nikopol',publisher:'Casterman'},
            {id:148,isbn:'9782203020085',series:'Bilal coffret Intégrale',number:'2',title:'Fins de siècle',publisher:'Casterman'},
            {id:149,isbn:'9782203020085',series:'Bilal coffret Intégrale',number:'3',title:"Un siècle d'amour",publisher:'Casterman'},
            {id:150,isbn:'9782203020085',series:'Bilal coffret Intégrale',number:'4',title:"L'Intégrale du Monstre",publisher:'Casterman'},
            {id:156,isbn:'9782355741302',series:'Fear Agent',title:'Intégrale Volume Deux',publisher:'Akileos'},
            {id:4,series:'One shot',title:'Sans ISBN',publisher:'Editeur C'}
          ];
          const results=new Array(albums.length);let cursor=0;
          async function worker(){
            while(cursor<albums.length){
              const index=cursor++,album=albums[index],started=Date.now();
              const candidates=await fetchBdbaseCoverCandidates(album,{timeoutMs:10000});
              const c=candidates[0];
              results[index]={id:album.id,isbn:album.isbn||null,series:album.series,title:album.title,found:Boolean(c),sourceUrl:c?.sourceUrl||null,coverUrl:c?.coverUrl||null,width:c?.coverWidth||null,height:c?.coverHeight||null,identifierMatch:c?.coverEvidence?.identifierMatch||false,score:c?.coverEvidence?.bibliographicScore||null,ms:Date.now()-started};
            }
          }
          await Promise.all([worker(),worker(),worker(),worker(),worker()]);
          for(const result of results)console.log(JSON.stringify(result));
          console.log(`FOUND=${results.filter(result=>result.found).length}/${albums.length}`);
          NODE
