name: Deploy preview to alwaysdata

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/fixtures/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/deploy-alwaysdata.yml'
  workflow_dispatch:

concurrency:
  group: alwaysdata-preview
  cancel-in-progress: true

env:
  ALWAYSDATA_HOST: ssh-tatoune.alwaysdata.net
  ALWAYSDATA_USER: tatoune
  ALWAYSDATA_TARGET: /home/tatoune/www/bd-desk
  ALWAYSDATA_SITE_HOST: tatoune.alwaysdata.net
  PREVIEW_URL: https://tatoune.alwaysdata.net
  ALWAYSDATA_PASSWORD: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
  ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY || vars.ALWAYSDATA_API_KEY || secrets.ALWAYS_DATA_API_KEY || vars.ALWAYS_DATA_API_KEY }}
  BD_DESK_EDITION: ${{ vars.BD_DESK_EDITION || 'licensed' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deployment not configured yet
        if: env.ALWAYSDATA_PASSWORD == ''
        run: |
          echo '::error::ALWAYSDATA_PASSWORD is unavailable to this workflow. Configure it as a repository/organization Actions secret or variable with access to this repository.'
          exit 1

      - name: Validate deployment control secrets
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          LICENSE_SECRET: ${{ secrets.BD_DESK_LICENSE_SECRET || vars.BD_DESK_LICENSE_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET || vars.WEBHOOK_SIGNING_SECRET }}
        run: |
          test -n "$ALWAYSDATA_API_KEY" || { echo '::error::The AlwaysData API key is unavailable. The workflow cannot prove that the AlwaysData Node process was restarted.'; echo 'Configure ALWAYSDATA_API_KEY (or the existing compatibility name ALWAYS_DATA_API_KEY) as a repository secret or variable before deploying BD Desk.'; exit 1; }
          case "$BD_DESK_EDITION" in
            free) ;;
            licensed)
              test -n "$LICENSE_SECRET" || { echo '::error::BD_DESK_LICENSE_SECRET is unavailable to this workflow.'; exit 1; }
              test -n "$WEBHOOK_SECRET" || { echo '::error::WEBHOOK_SIGNING_SECRET is unavailable to this workflow.'; exit 1; }
              ;;
            *) echo '::error::BD_DESK_EDITION must be free or licensed.'; exit 1 ;;
          esac

      - name: Install SSH deployment tools
        if: env.ALWAYSDATA_PASSWORD != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Trust alwaysdata SSH host
        if: env.ALWAYSDATA_PASSWORD != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$ALWAYSDATA_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync BD Desk preview
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "mkdir -p '$ALWAYSDATA_TARGET' /home/tatoune/data"
          sshpass -e rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'coverage/' \
            ./ "$ALWAYSDATA_USER@$ALWAYSDATA_HOST:$ALWAYSDATA_TARGET/"
          case "$BD_DESK_EDITION" in
            free|licensed) ;;
            *) echo '::error::BD_DESK_EDITION must be free or licensed.'; exit 1 ;;
          esac
          printf '%s\n' "$BD_DESK_EDITION" | sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "cat > /home/tatoune/data/bd-desk-edition && chmod 600 /home/tatoune/data/bd-desk-edition"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "chmod +x '$ALWAYSDATA_TARGET/deploy/alwaysdata-start.sh'"

      - name: Verify normalized metadata source deployed
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "node --check '$ALWAYSDATA_TARGET/src/metadata.js'"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F 'hachetteSearchUrl' '$ALWAYSDATA_TARGET/src/metadata.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F 'resolveCandidates' '$ALWAYSDATA_TARGET/src/metadata.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "node --check '$ALWAYSDATA_TARGET/src/db.js'"

      - name: Verify cover resolver deployed
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "test -s '$ALWAYSDATA_TARGET/public/cover-sources.js'"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F 'openapi.bnf.fr/couverture' '$ALWAYSDATA_TARGET/public/cover-sources.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F '/cover/resolve' '$ALWAYSDATA_TARGET/public/cover-sources.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "! grep -F 'covers.openlibrary.org' '$ALWAYSDATA_TARGET/public/cover-sources.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "! grep -F 'media.hachette.fr/imgArticle/GLENAT' '$ALWAYSDATA_TARGET/public/cover-sources.js' >/dev/null"

      - name: Configure preview license secret
        if: env.ALWAYSDATA_PASSWORD != '' && env.BD_DESK_EDITION != 'free'
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
          LICENSE_SECRET: ${{ secrets.BD_DESK_LICENSE_SECRET || vars.BD_DESK_LICENSE_SECRET }}
        run: |
          test -n "$LICENSE_SECRET" || { echo '::error::BD_DESK_LICENSE_SECRET is unavailable to this workflow.'; exit 1; }
          printf '%s' "$LICENSE_SECRET" | base64 -w 0 | sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "base64 -d > /home/tatoune/data/bd-desk-license-secret && chmod 600 /home/tatoune/data/bd-desk-license-secret"

      - name: Configure preview webhook secret
        if: env.ALWAYSDATA_PASSWORD != '' && env.BD_DESK_EDITION != 'free'
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD || vars.ALWAYSDATA_PASSWORD }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET || vars.WEBHOOK_SIGNING_SECRET }}
        run: |
          test -n "$WEBHOOK_SECRET" || { echo '::error::WEBHOOK_SIGNING_SECRET is unavailable to this workflow.'; exit 1; }
          printf '%s' "$WEBHOOK_SECRET" | base64 -w 0 | sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "base64 -d > /home/tatoune/data/bd-desk-webhook-secret && chmod 600 /home/tatoune/data/bd-desk-webhook-secret"

      - name: Discover and restart alwaysdata HTTP site
        if: env.ALWAYSDATA_API_KEY != ''
        run: |
          SITES="$(curl -fsS --basic --user "${ALWAYSDATA_API_KEY} account=${ALWAYSDATA_USER}:" https://api.alwaysdata.com/v1/site/)"
          SITE_ID="$(SITES_JSON="$SITES" python3 - "$ALWAYSDATA_SITE_HOST" <<'PY'
          import json, os, re, sys

          payload=json.loads(os.environ['SITES_JSON'])
          requested=sys.argv[1].strip().lower().rstrip('.')

          def site_items(value):
              if isinstance(value,list):
                  return value
              if isinstance(value,dict):
                  for key in ('results','data','objects','items'):
                      nested=value.get(key)
                      if isinstance(nested,list):
                          return nested
                      if isinstance(nested,dict):
                          found=site_items(nested)
                          if found:
                              return found
              return []

          def hostname(value):
              if isinstance(value,dict):
                  for key in ('address','host','hostname','name','url'):
                      if value.get(key):
                          return hostname(value[key])
                  return ''
              if not isinstance(value,str):
                  return ''
              value=re.sub(r'^https?://','',value.strip().lower()).split('/',1)[0]
              if value.count(':')==1:
                  value=value.rsplit(':',1)[0]
              return value.rstrip('.')

          items=site_items(payload)
          hits=[site for site in items if isinstance(site,dict) and any(hostname(address)==requested for address in (site.get('addresses') or []))]
          if len(hits)!=1:
              available=[{'id':site.get('id'),'addresses':site.get('addresses',[])} for site in items if isinstance(site,dict)]
              print(json.dumps({'requested':requested,'available':available},ensure_ascii=False),file=sys.stderr)
              raise SystemExit(1)
          print(hits[0]['id'])
          PY
          )"
          if [ -z "$SITE_ID" ]; then
            echo "::error::Unable to resolve alwaysdata site id for $ALWAYSDATA_SITE_HOST"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 2 \
            --request POST \
            --basic \
            --user "${ALWAYSDATA_API_KEY} account=${ALWAYSDATA_USER}:" \
            --header 'alwaysdata-synchronous: yes' \
            "https://api.alwaysdata.com/v1/site/${SITE_ID}/restart/"
          echo

      - name: Preview health check
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/health"
          echo

      - name: Activate Premium license for preview
        if: env.BD_DESK_EDITION != 'free'
        env:
          LICENSE_SECRET: ${{ secrets.BD_DESK_LICENSE_SECRET || vars.BD_DESK_LICENSE_SECRET }}
        run: |
          test -n "$LICENSE_SECRET" || { echo '::error::BD_DESK_LICENSE_SECRET is unavailable to this workflow.'; exit 1; }
          LICENSE_VALUE="$(BD_DESK_LICENSE_SECRET="$LICENSE_SECRET" node scripts/generate-license.js alwaysdata-preview)"
          LICENSE_PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1]}))' "$LICENSE_VALUE")"
          LICENSE_RESPONSE="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            --request POST "$PREVIEW_URL/api/license/activate" \
            --header 'content-type: application/json' \
            --data "$LICENSE_PAYLOAD")"
          node -e "const x=JSON.parse(process.argv[1]); if(x.plan!=='premium') throw new Error('Preview license was not activated');" "$LICENSE_RESPONSE"
          echo 'Preview Premium license activated without exposing the key.'

      - name: Start cover search for existing preview albums
        if: env.BD_DESK_EDITION != 'free'
        run: |
          RESPONSE="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            --request POST "$PREVIEW_URL/api/covers/resolve")"
          echo "$RESPONSE"
          node -e "const x=JSON.parse(process.argv[1]); if(!['idle','running','completed'].includes(x.status)&&x.started!==true) throw new Error('Cover search did not start');" "$RESPONSE"
          echo 'Existing preview albums queued for verified cover search.'

      - name: Verify live BDGest preview route
        run: |
          HTTP_CODE="$(curl -sS --retry 15 --retry-delay 2 --retry-all-errors \
            --request POST "$PREVIEW_URL/api/import/bdgest/preview" \
            --header 'content-type: text/csv' \
            --data-binary @tests/fixtures/bdgest-sample.csv \
            -o /tmp/bd-desk-bdgest-preview.json \
            -w '%{http_code}')"
          cat /tmp/bd-desk-bdgest-preview.json
          node -e "const status=process.argv[1], x=JSON.parse(process.argv[2]); if(status!=='200'||x.valid!==true||x.rows!==4) throw new Error('Live BDGest preview route is not the deployed server route');" "$HTTP_CODE" "$(cat /tmp/bd-desk-bdgest-preview.json)"
          echo 'Live BDGest preview route verified without writing the preview database.'

      - name: Verify live same-origin cover proxy
        run: |
          ALBUMS="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/albums?limit=200")"
          ALBUM_ID="$(node -e "const x=JSON.parse(process.argv[1]); const a=(x.items||[]).find(v=>v.isbn==='9782344059814'); if(!a) throw new Error('Sweet Revenge album missing'); process.stdout.write(String(a.id))" "$ALBUMS")"
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            --request POST "$PREVIEW_URL/api/albums/$ALBUM_ID/cover/resolve" >/tmp/bd-desk-cover-resolution.json
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -D /tmp/bd-desk-cover-headers \
            "$PREVIEW_URL/api/albums/$ALBUM_ID/cover/image?v=${GITHUB_SHA}" \
            -o /tmp/bd-desk-cover-image
          test -s /tmp/bd-desk-cover-image
          grep -i '^content-type: image/' /tmp/bd-desk-cover-headers >/dev/null
          file -b --mime-type /tmp/bd-desk-cover-image | grep -F 'image/' >/dev/null
          echo "Live same-origin cover proxy verified for Sweet Revenge: $(wc -c < /tmp/bd-desk-cover-image) bytes."

      - name: Verify live experience V3 and cover resolver
        run: |
          HTML="$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/?build=${GITHUB_SHA}")"
          printf '%s' "$HTML" | grep -F 'Collection studio' >/dev/null
          EXPERIENCE_CSS="$(printf '%s' "$HTML" | grep -oE '/experience-v3\.css\?v=[0-9]{8}-[0-9]+' | head -1)"
          EXPERIENCE_JS="$(printf '%s' "$HTML" | grep -oE '/experience-v3\.js\?v=[0-9]{8}-[0-9]+' | head -1)"
          COVER_JS="$(printf '%s' "$HTML" | grep -oE '/cover-sources\.js\?v=[0-9]{8}-[0-9]+' | head -1)"
          test -n "$EXPERIENCE_CSS" && test -n "$EXPERIENCE_JS" && test -n "$COVER_JS"
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL$EXPERIENCE_CSS" | grep -F '.editorial-cover' >/dev/null
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL$EXPERIENCE_JS" | grep -F 'BDDeskExperience' >/dev/null
          COVER_CODE="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL$COVER_JS")"
          printf '%s' "$COVER_CODE" | grep -F 'openapi.bnf.fr/couverture' >/dev/null
          printf '%s' "$COVER_CODE" | grep -F '/cover/resolve' >/dev/null
          ! printf '%s' "$COVER_CODE" | grep -F 'covers.openlibrary.org' >/dev/null
          ! printf '%s' "$COVER_CODE" | grep -F 'media.hachette.fr/imgArticle/GLENAT' >/dev/null
          echo 'Live BD Desk experience V3 and real cover resolver verified.'

      - name: Verify live metadata normalization
        run: |
          DISCOVERY="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/discover?isbn=9782344059814")"
          node -e "const x=JSON.parse(process.argv[1]); const f=x.resolution?.fields||{}; if(f.title?.value!=='Sweet revenge') throw new Error('Unexpected resolved title'); if(f.publisher?.value!=='Glénat') throw new Error('Unexpected resolved publisher'); if(f.series?.value!=='Valhalla Bunker') throw new Error('Unexpected resolved series'); if(f.number?.value!=='1') throw new Error('Unexpected resolved number'); if(f.collectionName?.value!=='Comix Buro') throw new Error('Unexpected resolved collection'); if(f.printDate?.value!=='2024-08-21') throw new Error('Unexpected resolved date'); if(f.pageCount?.value!==64) throw new Error('Unexpected resolved page count'); if(f.format?.value!=='24 × 32 cm') throw new Error('Unexpected resolved format'); if(x.resolution?.cover?.source!=='hachette') throw new Error('Official Hachette cover not selected');" "$DISCOVERY"
          echo 'Live metadata normalization verified.'

      - name: Verify Sweet Revenge official cover source
        run: |
          DISCOVERY="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/discover?isbn=9782344059814")"
          COVER_URL="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.resolution?.cover?.url) throw new Error('No resolved cover'); process.stdout.write(x.resolution.cover.url)" "$DISCOVERY")"
          printf '%s' "$COVER_URL" | grep -F 'images.hachette-livre.fr' >/dev/null
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$COVER_URL" -o /tmp/sweet-revenge-cover.jpeg
          test -s /tmp/sweet-revenge-cover.jpeg
          echo "Sweet Revenge official cover source verified: $(wc -c < /tmp/sweet-revenge-cover.jpeg) bytes."
