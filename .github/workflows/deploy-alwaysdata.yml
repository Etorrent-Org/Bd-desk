name: Deploy preview to alwaysdata

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/fixtures/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/deploy-alwaysdata.yml'
  workflow_dispatch:

concurrency:
  group: alwaysdata-preview
  cancel-in-progress: true

env:
  ALWAYSDATA_HOST: ssh-tatoune.alwaysdata.net
  ALWAYSDATA_USER: tatoune
  ALWAYSDATA_TARGET: /home/tatoune/www/bd-desk
  PREVIEW_URL: https://tatoune.alwaysdata.net
  ALWAYSDATA_PASSWORD: ${{ secrets.ALWAYSDATA_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deployment not configured yet
        if: env.ALWAYSDATA_PASSWORD == ''
        run: |
          echo '::error::Repository secret ALWAYSDATA_PASSWORD is missing.'
          exit 1

      - name: Install SSH deployment tools
        if: env.ALWAYSDATA_PASSWORD != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Trust alwaysdata SSH host
        if: env.ALWAYSDATA_PASSWORD != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$ALWAYSDATA_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync BD Desk preview
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "mkdir -p '$ALWAYSDATA_TARGET' /home/tatoune/data"
          sshpass -e rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'coverage/' \
            ./ "$ALWAYSDATA_USER@$ALWAYSDATA_HOST:$ALWAYSDATA_TARGET/"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "chmod +x '$ALWAYSDATA_TARGET/deploy/alwaysdata-start.sh'"

      - name: Verify normalized metadata source deployed
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F \"return 'Glénat';\" '$ALWAYSDATA_TARGET/src/metadata.js' >/dev/null"
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "grep -F \"collection: collectionFromPublisher(rawPublisher)\" '$ALWAYSDATA_TARGET/src/metadata.js' >/dev/null"

      - name: Runtime diagnostics before restart
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" 'echo "=== processes ==="; ps -u "$(id -u)" -o pid=,ppid=,etime=,args= | grep -E "node|server\.js|alwaysdata-start" || true; echo "=== listeners ==="; ss -ltnp 2>/dev/null | grep -E "node|3096|127\.0\.0\.1|0\.0\.0\.0" || true; echo "=== local 3096 health ==="; curl -sS --max-time 3 http://127.0.0.1:3096/api/health || true; echo; echo "=== local 3096 discover ==="; curl -sS --max-time 8 "http://127.0.0.1:3096/api/discover?isbn=9782344059814" || true; echo'

      - name: Restart BD Desk backend
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" "pkill -TERM -f '/home/tatoune/www/bd-desk/[s]rc/server.js' || true"
          sleep 4

      - name: Runtime diagnostics after restart
        if: env.ALWAYSDATA_PASSWORD != ''
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_PASSWORD }}
        run: |
          sshpass -e ssh "$ALWAYSDATA_USER@$ALWAYSDATA_HOST" 'echo "=== processes ==="; ps -u "$(id -u)" -o pid=,ppid=,etime=,args= | grep -E "node|server\.js|alwaysdata-start" || true; echo "=== listeners ==="; ss -ltnp 2>/dev/null | grep -E "node|3096|127\.0\.0\.1|0\.0\.0\.0" || true; echo "=== local 3096 health ==="; curl -sS --max-time 3 http://127.0.0.1:3096/api/health || true; echo; echo "=== local 3096 discover ==="; curl -sS --max-time 8 "http://127.0.0.1:3096/api/discover?isbn=9782344059814" || true; echo'

      - name: Preview health check
        if: env.ALWAYSDATA_PASSWORD != ''
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/health"
          echo

      - name: Verify live metadata normalization
        if: env.ALWAYSDATA_PASSWORD != ''
        run: |
          DISCOVERY="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors "$PREVIEW_URL/api/discover?isbn=9782344059814")"
          node -e "const x=JSON.parse(process.argv[1]); const c=x.candidates.find(v=>v.source==='bnf'); if(!c) throw new Error('BnF candidate missing'); if(c.title!=='Sweet revenge') throw new Error('Unexpected BnF title: '+c.title); if(c.publisher!=='Glénat') throw new Error('Unexpected BnF publisher: '+c.publisher); if(c.collection!=='Comix Buro') throw new Error('Unexpected BnF collection: '+c.collection);" "$DISCOVERY"
          echo "Live metadata normalization verified."
